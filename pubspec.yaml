name: cuan_mobile
description: Cuan mobile — private finance, tracked by chat. Midnight Ledger edition.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.7.0
  cookie_jar: ^4.0.8
  dio_cookie_manager: ^3.2.0
  intl: ^0.20.2
  google_fonts: ^6.2.1
  path_provider: ^2.1.4
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  flutter_local_notifications: ^22.3.2
  flutter_bloc: ^9.1.1
  equatable: ^3.0.0
  local_auth: ^3.0.2
  shared_preferences: ^2.5.5
  speech_to_text: ^7.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
